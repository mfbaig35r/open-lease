name: Publish

# A version tag publishes to PyPI, e.g.:  git tag v0.1.0 && git push origin v0.1.0
# (tag-push, not a GitHub Release). Bump `version` in pyproject.toml to match the tag first.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build the visual workbench (open-lease-ui) and bundle it into the package so the released
      # wheel serves `gpu ui` out of the box. gpu_orchestrator/web is gitignored (a build output),
      # so it must be produced here. open-lease-ui is a public repo, so a plain checkout works.
      #
      # The workbench ref is DERIVED from this release's tag: v0.5.0 here builds open-lease-ui at
      # v0.5.0. The two version in lockstep (the workbench ships only inside this wheel), so the tag
      # already names the workbench, and there is no pin to keep in step or forget. A missing UI tag
      # fails the release loudly rather than silently substituting something else.
      #
      # OPEN_LEASE_UI_REF stays as a deliberate override, for the rare release that needs a different
      # workbench than its own version (a backend-only fix on an older UI, or a main build to test the
      # pipeline). It warns when set, because a forgotten override is exactly the drift this replaced.
      - name: Resolve the workbench ref
        id: ui
        env:
          OVERRIDE: ${{ vars.OPEN_LEASE_UI_REF }}
          TAG: ${{ github.ref_name }}
          UI_REPO: https://github.com/mfbaig35r/open-lease-ui.git
        run: |
          if [ -n "$OVERRIDE" ]; then
            ref="$OVERRIDE"
            echo "::warning title=Workbench ref overridden::Building the workbench from '$ref', not from this release's tag '$TAG', because the OPEN_LEASE_UI_REF variable is set. Unset it to derive the ref from the tag."
          else
            ref="$TAG"
          fi
          if ! git ls-remote --exit-code "$UI_REPO" "refs/tags/$ref" >/dev/null 2>&1 \
             && ! git ls-remote --exit-code "$UI_REPO" "refs/heads/$ref" >/dev/null 2>&1; then
            echo "::error title=No matching workbench::open-lease-ui has no ref '$ref'. Tag the workbench with this version before releasing (scripts/release.py does it), or set OPEN_LEASE_UI_REF to an existing ref."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "derived=$([ -n "$OVERRIDE" ] && echo no || echo yes)" >> "$GITHUB_OUTPUT"

      - name: Check out open-lease-ui
        uses: actions/checkout@v4
        with:
          repository: mfbaig35r/open-lease-ui
          ref: ${{ steps.ui.outputs.ref }}
          path: ui-src

      # Record which workbench actually went into this wheel, on the run page. Without this, "which
      # workbench shipped in 0.4.0" is only answerable by digging through checkout logs.
      - name: Record the bundled workbench
        working-directory: ui-src
        run: |
          {
            echo "### Bundled workbench"
            echo "- open-lease-ui ref: \`${{ steps.ui.outputs.ref }}\`"
            echo "- commit: \`$(git rev-parse HEAD)\`"
            if [ "${{ steps.ui.outputs.derived }}" = "yes" ]; then
              echo "- derived from the release tag"
            else
              echo "- **overridden** by the OPEN_LEASE_UI_REF variable, not derived from the tag"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
        with:
          version: 10 # open-lease-ui uses pnpm 10 conventions (settings in pnpm-workspace.yaml)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui-src/pnpm-lock.yaml
      - name: Build + bundle the UI into gpu_orchestrator/web
        working-directory: ui-src
        run: |
          pnpm install --frozen-lockfile
          pnpm build:embedded   # empty NEXT_PUBLIC_API_URL -> same-origin fetches
          rm -rf ../src/gpu_orchestrator/web
          cp -r out ../src/gpu_orchestrator/web

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --extra dev
      - name: Lint + format
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/
      - name: Test (offline, mock provider)
        run: uv run python -m pytest tests/ -q
      - name: Build sdist + wheel
        run: uv build
      - name: Verify the wheel bundled the UI
        run: |
          python -c "import zipfile,glob,sys; w=glob.glob('dist/*.whl')[0]; \
          names=zipfile.ZipFile(w).namelist(); \
          ok=any(n.endswith('gpu_orchestrator/web/index.html') for n in names); \
          print('UI bundled:' if ok else 'MISSING UI in wheel:', w); \
          sys.exit(0 if ok else 1)"
      - name: Check metadata + README render for PyPI
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC): no API token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
